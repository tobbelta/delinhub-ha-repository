name: Dagskoll Codex
version: "0.1.5"
slug: dagskoll_codex
description: Codex med ChatGPT-inloggning för Dagskolls analyser
arch: [aarch64, amd64]
image: ghcr.io/tobbelta/dagskoll-codex
startup: application
boot: manual
init: false
homeassistant_api: true
map:
  - type: addon_config
    read_only: false
options:
  access_token: ""
  model: gpt-6-luna
  reasoning_effort: low
  daily_start_limit: 40
schema:
  access_token: password
  model: match(^[a-zA-Z0-9][a-zA-Z0-9._-]{0,79}$)
  reasoning_effort: list(low|medium)
  daily_start_limit: int(1,40)
